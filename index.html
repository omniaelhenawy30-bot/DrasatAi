<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملوك مصر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0}body{background:#FFF8E1;text-align:center}
.king{width:150px;margin:10px auto;background:#fff;border-radius:50%;border:5px solid #FFD600;padding:10px;box-shadow:0 6px 0 #0002}
.mouth{width:40px;height:12px;background:#5D4037;border-radius:0 0 15px 15px;margin:5px auto}
.mouth.go{animation:talk .12s infinite alternate}
@keyframes talk{0%{height:8px}100%{height:28px}}
.bubble{background:#fff;margin:12px;border-radius:18px;padding:14px;box-shadow:0 4px 0 #FFD600;font-size:16px;line-height:1.8}
.btn{padding:12px 25px;background:#6C5CE7;color:#fff;border:none;border-radius:25px;font-weight:900;margin:6px;box-shadow:0 5px 0 #4834D4}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;max-width:380px;margin:10px auto}
.place{background:#fff;border-radius:15px;padding:12px;box-shadow:0 3px 0 #0002;border:3px solid transparent;cursor:pointer;font-weight:700}
.place.active{border-color:#FFD600;background:#FFF9C4;transform:scale(1.05)}
</style>
</head>
<body>
<img src="https://cdn-icons-png.flaticon.com/512/4205/4205907.png" class="king" id="kingImg">
<h2 id="name">👑 الملك خوفو</h2>
<p id="city" style="color:#888">كفر الشيخ - الوجه البحري</p>
<div class="mouth" id="mouth"></div>
<div class="bubble" id="bubble">أهلا يا بطل! دوس على الزرار واسمعني! أنا هشرحلك محافظات مصر كلها بصوتي!</div>
<button class="btn" onclick="speak()">🔊 اسمع الملك</button>

<div class="map">
<div class="place" onclick="pick('كفر الشيخ',this)">⭐ كفر الشيخ</div>
<div class="place" onclick="pick('الإسكندرية',this)">👸 إسكندرية</div>
<div class="place" onclick="pick('القاهرة',this)">🏛️ القاهرة</div>
<div class="place" onclick="pick('دمياط',this)">🐟 دمياط</div>
<div class="place" onclick="pick('الجيزة',this)">🔺 الجيزة</div>
<div class="place" onclick="pick('الأقصر',this)">🏺 الأقصر</div>
<div class="place" onclick="pick('أسوان',this)">🌊 أسوان</div>
<div class="place" onclick="pick('الوادي الجديد',this)">🌴 الوادي الجديد</div>
<div class="place" onclick="pick('سيناء',this)">⛰️ سيناء</div>
</div>

<script>
let curPlace='كفر الشيخ';
const texts={
'كفر الشيخ':'يا هلا بأهل كفر الشيخ! انا الملك خوفو باني الهرم الاكبر. كفر الشيخ محافظة جميلة على البحر المتوسط مشهورة بالرز والسمك وبحيرة البرلس. وهي من محافظات الوجه البحري اللي عددهم تلاتاشر محافظة!',
'الإسكندرية':'انا كليوباترا ملكة اسكندرية عروس البحر المتوسط! اسكندرية فيها المينا الكبير ومكتبة اسكندرية وجوها تحفة!',
'القاهرة':'القاهرة عاصمة مصر واكبر محافظة فيها تلاتاشر مليون واحد! فيها القلعة والازهر!',
'دمياط':'دمياط اصغر محافظة في مصر كلها! مشهورة بالاثاث والسمك!',
'الجيزة':'الجيزة فيها الاهرامات التلاتة وابو الهول! انا اللي بنيت الهرم الاكبر!',
'الأقصر':'الاقصر فيها تلت اثار العالم كله! معبد الكرنك ووادي الملوك!',
'أسوان':'اسوان فيها السد العالي ومعبد ابو سمبل وجزيرة فيلة! جوها جميل في الشتا!',
'الوادي الجديد':'الوادي الجديد اكبر محافظة في مصر كلها! مساحتها كبيرة قوي بس صحراء وفيها واحات!',
'سيناء':'سيناء فيها شرم الشيخ ودهب وجبل سانت كاترين! احلى مكان للسياحة!'
};
function pick(p,el){
curPlace=p;
document.querySelectorAll('.place').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
document.getElementById('city').innerText=p;
document.getElementById('bubble').innerText=texts[p];
speak();
}
function speak(){
let t=texts[curPlace];
document.getElementById('bubble').innerText=t;
let m=document.getElementById('mouth');
m.classList.add('go');
let u=new SpeechSynthesisUtterance(t);
u.lang='ar-EG';u.rate=0.85;
u.onend=()=>m.classList.remove('go');
speechSynthesis.speak(u);
}
</script>
</body>
</html>
