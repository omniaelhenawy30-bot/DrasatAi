<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrasatAi - ملوك مصر 👑</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>*{font-family:'Cairo'}</style>
</head>
<body class="bg-[#FFFDF5]">
<div id="root"></div>

<script type="text/babel">
const { useState } = React;
function App() {
  const [open, setOpen] = useState(null);
  const lessons = [
    { id:1, emoji:"🌊", color:"bg-[#FFF8E1]", title:"الوجه البحري", desc:"13 محافظة - كفر الشيخ بلدنا!", time:"2:15", video:"https://www.youtube.com/embed/3SsK-cxlj_w", text:"الوجه البحري 13 محافظة على البحر المتوسط، فيه كفر الشيخ بتاعتنا بتعمل رز وسمك ودمياط أصغر محافظة!" },
    { id:2, emoji:"🏜️", color:"bg-[#FFF0F0]", title:"الوجه القبلي", desc:"الأهرامات والأقصر وأسوان", time:"2:30", video:"https://www.youtube.com/embed/9p5y1q2L6y0", text:"من الجيزة لحد أسوان! الجيزة فيها الأهرامات والأقصر تلت آثار العالم!" },
    { id:3, emoji:"🏔️", color:"bg-[#F0FFF4]", title:"المحافظات الحدودية", desc:"الوادي الجديد أكبر محافظة!", time:"2:05", video:"https://www.youtube.com/embed/2Vv-BfVoq4g", text:"5 محافظات بس كل واحدة قد الدنيا! الوادي الجديد أكبر محافظة في مصر!" },
  ];
  return (
    <div dir="rtl" className="min-h-screen">
      <nav className="max-w-6xl mx-auto flex justify-between items-center p-4">
        <div className="flex items-center gap-2 font-black text-xl"><span className="bg-[#6C5CE7] text-white w-9 h-9 rounded-xl flex items-center justify-center">👑</span> DrasatAi</div>
        <div className="bg-[#FFF4CC] px-4 py-2 rounded-full text-sm font-bold">🔥 27 محافظة</div>
      </nav>
      <div className="max-w-6xl mx-auto px-4 mt-6 grid md:grid-cols-2 gap-6 items-center">
        <div>
          <h1 className="text-5xl font-black leading-tight">أهلا<br/><span className="text-[#6C5CE7]">بملوك مصر!</span> 👑</h1>
          <p className="text-gray-600 mt-4">ده موقع React بجد شغال على GitHub بتاعك من غير تسجيل دخول</p>
          <button onClick={()=>document.getElementById('lessons').scrollIntoView({behavior:'smooth'})} className="mt-6 bg-[#FFD600] px-7 py-3 rounded-2xl font-black shadow-[0_5px_0_#E67E22]">ابدأ دلوقتي 🚀</button>
        </div>
        <div className="bg-gradient-to-br from-[#6C5CE7] to-[#A29BFE] rounded-[32px] p-6 text-white min-h-[300px] flex flex-col justify-end">
          <div className="bg-white text-black rounded-2xl p-4"><b>الوجه البحري</b><p className="text-xs text-gray-500 mt-1">كفر الشيخ • دمياط • اسكندرية...</p></div>
        </div>
      </div>
      <div id="lessons" className="max-w-6xl mx-auto px-4 mt-16">
        <h2 className="text-2xl font-black">📚 دروسك يا ملك</h2>
        <div className="grid md:grid-cols-3 gap-4 mt-6">
          {lessons.map(l=>(
            <div key={l.id} onClick={()=>setOpen(l)} className="bg-white rounded-[20px] p-3 border-2 border-gray-100 hover:border-[#6C5CE7] cursor-pointer hover:-translate-y-1 transition-all">
              <div className={`${l.color} rounded-[16px] h-32 flex items-center justify-center text-5xl`}>{l.emoji}</div>
              <div className="p-2"><b className="block mt-2">{l.title}</b><p className="text-xs text-gray-500 mt-1">{l.desc}</p><span className="bg-black text-white px-2 py-1 rounded-full text-xs mt-2 inline-block">▶️ {l.time}</span></div>
            </div>
          ))}
        </div>
      </div>
      {open && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50" onClick={()=>setOpen(null)}>
          <div className="bg-white rounded-[24px] max-w-2xl w-full overflow-hidden" onClick={e=>e.stopPropagation()}>
            <div className="aspect-video bg-black"><iframe className="w-full h-full" src={open.video+"?autoplay=1"} allowFullScreen></iframe></div>
            <div className="p-5"><h3 className="font-black text-xl">{open.title}</h3><p className="text-sm text-gray-600 mt-2">{open.text}</p><button onClick={()=>setOpen(null)} className="w-full mt-4 bg-[#6C5CE7] text-white py-3 rounded-xl font-bold">تمام يا ملك! 👑</button></div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
